name: CI

# Fast checks on pull requests: does it compile and pass its tests on macOS?
# No .app or .dmg here; signed releases are built by release.yml, or locally
# with `pnpm tauri:build:signed`.
#
# `check` is a required status check with no bypass, so it must always report.
# A docs-only PR skips it through `if:` (a skipped job reports success) rather
# than `paths-ignore` (which would leave the check pending for ever).
# release-please.yml dispatches this workflow on its release PR, because PRs
# opened with the built-in token don't trigger pull_request runs. That PR only
# bumps versions and the changelog of code already tested on main, so `check`
# is skipped there too.
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Does it change more than docs?
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" == release-please--* ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE...HEAD" \
            | grep -v -E '\.md$|^docs/|^config\.example\.toml$|^\.env\.signing\.example$' \
            | head -1 || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Core tests
        run: cargo test -p drovr-core

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type-check the UI
        working-directory: app
        run: pnpm check

      # tauri::generate_context! embeds the built frontend, and tauri-build
      # needs the drovr sidecar binary to exist, so build both (debug) first.
      - name: Build frontend and CLI
        working-directory: app
        run: pnpm build && pnpm cli

      - name: App tests
        run: cargo test -p drovr-app

      # Every crate, tests included; any warning fails the check.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
