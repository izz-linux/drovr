name: Release Please

# On every push to main, release-please keeps a release PR up to date: the
# next version (from Conventional Commit messages: fix → patch, feat → minor,
# feat! or BREAKING CHANGE → major), the CHANGELOG, and the version in every
# file that has one. Merging that PR tags the release, creates the GitHub
# Release, and builds and attaches the signed .dmg (release.yml).
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and releases
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please can't pick our packages out of Cargo.lock, so update their
  # versions there on the release PR's branch. The commit goes through the API
  # rather than git push, so GitHub signs it: main requires signed commits, and
  # a personal account's rulesets can't exempt GitHub Actions.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Update Cargo.lock
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          cargo update --workspace
          if git diff --quiet Cargo.lock; then exit 0; fi
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            --rawfile lock <(base64 -w0 Cargo.lock) \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "chore: update Cargo.lock" },
                fileChanges: { additions: [ { path: "Cargo.lock", contents: $lock } ] }
              } }
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid'

  # CI is required, but the built-in token's pushes and PRs don't trigger
  # pull_request runs, so start CI on the release PR's branch directly.
  ci:
    needs: [release-please, lockfile]
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # to attach the .dmg
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
