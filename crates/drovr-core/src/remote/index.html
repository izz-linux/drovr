<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="drovr">
<meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<title>drovr</title>
</head>
<body>
<header id="top">
  <span class="brand">drovr</span>
  <span id="where" class="muted"></span>
  <span id="conn" class="conn" title="Connection"></span>
</header>
<main id="main"></main>
<nav id="tabs">
  <a href="#inbox" data-view="inbox">Inbox <span id="badge" class="badge" hidden></span></a>
  <a href="#agents" data-view="agents">Agents</a>
  <a href="#reports" data-view="reports">Reports <span id="rbadge" class="badge" hidden></span></a>
  <a href="#bus" data-view="bus">Bus</a>
</nav>
<div id="report" class="overlay" hidden>
  <div class="bar">
    <button id="report-close" class="ghost">‹ Back</button>
    <span id="report-title" class="grow ellipsis"></span>
    <a id="report-open" target="_blank" rel="noopener">Open</a>
  </div>
  <iframe id="report-frame" title="Report"></iframe>
</div>
<div id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
