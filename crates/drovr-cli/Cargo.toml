[package]
name = "drovr-cli"
version = "0.16.1"
description = "The drovr CLI: orchestrate, monitor and share context across Claude Code, OpenCode and OpenAI Codex agents from a shell"
edition = "2021"
license = "MIT"

[[bin]]
name = "drovr"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
drovr-core = { path = "../drovr-core" }
